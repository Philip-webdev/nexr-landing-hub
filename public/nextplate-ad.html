<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Nextplate — Food Vendor Call-out</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: #000; font-family: 'Inter', sans-serif; color: #fff; position: relative; -webkit-font-smoothing: antialiased; }

  .bg {
    position: absolute; inset: 0;
    background-image: url('/african-vend.jfif');
    background-size: cover;
    background-position: center 30%;
  }
  .overlay {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.55) 34%, rgba(0,0,0,0.05) 62%, rgba(0,0,0,0.35) 100%);
  }
  .content { position: absolute; inset: 0; padding: 72px 76px; display: flex; flex-direction: column; justify-content: space-between; }

  .logo { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.02em; display: flex; align-items: baseline; }
  .logo .plate { background: #fff; color: #000; padding: 2px 14px; margin-left: 4px; font-weight: 800; }

  .bottom { max-width: 940px; }
  .kicker { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: #e8e8e8; }
  .kicker .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px rgba(255,255,255,0.6); }

  h1 { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 100px; line-height: 1.04; letter-spacing: -0.015em; margin-top: 26px; color: #fff; }

  .sub { margin-top: 26px; font-size: 34px; line-height: 1.4; color: #d9d9d9; font-weight: 400; }

  .cta-row { margin-top: 44px; display: flex; align-items: center; gap: 28px; }
  .cta { display: inline-flex; align-items: center; gap: 14px; background: #ffffff; color: #000; font-weight: 700; font-size: 28px; padding: 24px 38px; }
  .url { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 26px; color: #ffffff; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="logo">Next<span class="plate">plate</span></div>

    <div class="bottom">
      <div class="kicker"><span class="dot"></span>Call for food vendors</div>
      <h1>Sell food at<br>a fairer price.</h1>
      <div class="sub">We connect vendors to citizens with better food prices.</div>
      <div class="cta-row">
        <span class="cta">Become a vendor <span>→</span></span>
        <span class="url">thenextplate.xyz</span>
      </div>
    </div>
  </div>
</body>
</html>
